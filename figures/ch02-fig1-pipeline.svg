<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470"
     role="img" aria-labelledby="p1title p1desc">
  <title id="p1title">The four stages that turn C++ source code into a running program</title>
  <desc id="p1desc">A vertical pipeline of four stages. Source code enters the
  preprocessor, which produces an expanded translation unit. That goes to the compiler,
  which produces assembly code. That goes to the assembler, which produces an object
  file. Object files and library code go to the linker, which produces the executable.
  The loader then copies the executable into memory to run it. A note explains that the
  single g++ command performs all four stages in order.</desc>
  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <rect x="215" y="12" width="200" height="40" rx="5" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="30" text-anchor="middle" font-size="14" font-weight="bold">main.cpp</text>
    <text x="315" y="45" text-anchor="middle" font-size="11">source code you wrote</text>
    <path d="M315,52 L315,74" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>

    <rect x="195" y="76" width="240" height="42" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="94" text-anchor="middle" font-size="14" font-weight="bold">1. Preprocessor</text>
    <text x="315" y="110" text-anchor="middle" font-size="11">carries out #include and #define</text>
    <path d="M315,118 L315,140" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="447" y="136" font-size="11" fill="#555">translation unit</text>

    <rect x="195" y="142" width="240" height="42" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="160" text-anchor="middle" font-size="14" font-weight="bold">2. Compiler</text>
    <text x="315" y="176" text-anchor="middle" font-size="11">checks syntax and types</text>
    <path d="M315,184 L315,206" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="447" y="202" font-size="11" fill="#555">assembly code</text>

    <rect x="195" y="208" width="240" height="42" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="226" text-anchor="middle" font-size="14" font-weight="bold">3. Assembler</text>
    <text x="315" y="242" text-anchor="middle" font-size="11">produces machine code</text>
    <path d="M315,250 L315,272" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="447" y="268" font-size="11" fill="#555">main.o (object file)</text>

    <rect x="20" y="208" width="150" height="42" rx="5" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="95" y="226" text-anchor="middle" font-size="13" font-weight="bold">Library code</text>
    <text x="95" y="242" text-anchor="middle" font-size="11">iostream, already built</text>
    <path d="M95,250 L95,290 L160,290" stroke="#444" stroke-width="1.6" fill="none"/>
    <path d="M160,290 L191,290" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>

    <rect x="195" y="274" width="240" height="42" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="292" text-anchor="middle" font-size="14" font-weight="bold">4. Linker</text>
    <text x="315" y="308" text-anchor="middle" font-size="11">joins object files and libraries</text>
    <path d="M315,316 L315,338" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>

    <rect x="215" y="340" width="200" height="40" rx="5" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="358" text-anchor="middle" font-size="14" font-weight="bold">gradecalc</text>
    <text x="315" y="373" text-anchor="middle" font-size="11">executable file on disk</text>
    <path d="M315,380 L315,402" stroke="#444" stroke-width="1.6" marker-end="url(#pa)"/>

    <rect x="215" y="404" width="200" height="40" rx="5" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="315" y="422" text-anchor="middle" font-size="14" font-weight="bold">Loader</text>
    <text x="315" y="437" text-anchor="middle" font-size="11">copies it into memory and runs it</text>

    <text x="330" y="462" text-anchor="middle" font-size="12" fill="#555">
      One g++ command performs stages 1 through 4 in order.
    </text>
  </g>
</svg>
