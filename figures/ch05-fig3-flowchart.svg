<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" width="620" height="620"
     role="img" aria-labelledby="fc3t fc3d">
  <title id="fc3t">Flowchart for computing one assignment grade</title>
  <desc id="fc3d">A flowchart with nine steps. It begins at Start, then reads the
  assignment name, points earned, points possible, and bonus points. A decision asks
  whether points possible is greater than zero. If no, it displays the message that no
  percentage is available and goes to End. If yes, it adds bonus points to points
  earned, divides by points possible and multiplies by one hundred to get the
  percentage, displays the percentage, and goes to End.</desc>
  <defs>
    <marker id="fm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia,'Times New Roman',serif" font-size="13" fill="#1a1a1a">

    <rect x="185" y="14" width="130" height="36" rx="18" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="37" text-anchor="middle">Start</text>
    <path d="M250,50 L250,68" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="140,70 360,70 345,108 125,108" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="243" y="94" text-anchor="middle">Read assignment name</text>
    <path d="M250,108 L250,126" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="140,128 360,128 345,166 125,166" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="243" y="152" text-anchor="middle">Read points earned</text>
    <path d="M250,166 L250,184" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="140,186 360,186 345,224 125,224" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="243" y="210" text-anchor="middle">Read points possible</text>
    <path d="M250,224 L250,242" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="140,244 360,244 345,282 125,282" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="243" y="268" text-anchor="middle">Read bonus points</text>
    <path d="M250,282 L250,300" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="250,302 400,349 250,396 100,349" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="345" text-anchor="middle">points possible</text>
    <text x="250" y="361" text-anchor="middle">&gt; 0 ?</text>

    <path d="M400,349 L480,349 L480,470" stroke="#444" stroke-width="1.5" fill="none"/>
    <path d="M480,470 L480,496" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>
    <text x="416" y="341" font-size="12" fill="#555">no</text>

    <path d="M250,396 L250,414" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>
    <text x="262" y="410" font-size="12" fill="#555">yes</text>

    <rect x="120" y="416" width="260" height="34" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="438" text-anchor="middle">total = earned + bonus</text>
    <path d="M250,450 L250,468" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <rect x="120" y="470" width="260" height="34" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="492" text-anchor="middle">pct = total / possible × 100</text>
    <path d="M250,504 L250,522" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <polygon points="140,524 360,524 345,562 125,562" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="243" y="548" text-anchor="middle">Display percentage</text>

    <polygon points="405,498 585,498 570,536 390,536" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="488" y="522" text-anchor="middle" font-size="12">Display "not available"</text>

    <path d="M250,562 L250,580" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>
    <path d="M488,536 L488,570 L315,570 L315,580" stroke="#444" stroke-width="1.5" fill="none"/>
    <path d="M315,570 L315,580" stroke="#444" stroke-width="1.5" marker-end="url(#fm)"/>

    <rect x="185" y="582" width="130" height="34" rx="17" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="250" y="604" text-anchor="middle">End</text>
  </g>
</svg>
