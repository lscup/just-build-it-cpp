<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300"
     role="img" aria-labelledby="f1title f1desc">
  <title id="f1title">The four parts of a computer and how data moves between them</title>
  <desc id="f1desc">A block diagram. At the centre is the processor. Above it is main
  memory, connected by a two-way arrow. To the left is input, with a one-way arrow
  pointing into the processor. To the right is output, with a one-way arrow pointing
  away from the processor. Below is storage, connected to main memory by a two-way
  arrow. A caption notes that main memory is erased when power is lost, while storage
  is not.</desc>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">
    <rect x="235" y="120" width="150" height="60" rx="6" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="310" y="145" text-anchor="middle" font-weight="bold">Processor</text>
    <text x="310" y="165" text-anchor="middle" font-size="12">(CPU)</text>

    <rect x="235" y="20" width="150" height="55" rx="6" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="310" y="42" text-anchor="middle" font-weight="bold">Main memory</text>
    <text x="310" y="61" text-anchor="middle" font-size="12">(RAM)</text>

    <rect x="235" y="225" width="150" height="55" rx="6" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="310" y="247" text-anchor="middle" font-weight="bold">Storage</text>
    <text x="310" y="266" text-anchor="middle" font-size="12">(disk, SSD)</text>

    <rect x="30" y="122" width="120" height="55" rx="6" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="90" y="144" text-anchor="middle" font-weight="bold">Input</text>
    <text x="90" y="163" text-anchor="middle" font-size="12">keyboard</text>

    <rect x="470" y="122" width="120" height="55" rx="6" fill="#f7eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="530" y="144" text-anchor="middle" font-weight="bold">Output</text>
    <text x="530" y="163" text-anchor="middle" font-size="12">screen</text>

    <path d="M300,120 L300,80" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>
    <path d="M320,80 L320,120" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>
    <path d="M300,225 L300,183" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>
    <path d="M320,183 L320,225" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>
    <path d="M152,150 L231,150" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>
    <path d="M389,150 L468,150" stroke="#444" stroke-width="1.6" marker-end="url(#a1)"/>

    <text x="310" y="298" text-anchor="middle" font-size="12" fill="#555">
      Memory is erased when power is lost. Storage is not.
    </text>
  </g>
</svg>
