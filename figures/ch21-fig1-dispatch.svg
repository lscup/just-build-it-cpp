<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300"
     role="img" aria-labelledby="d21t d21d">
  <title id="d21t">How a call through a base pointer reaches the right function</title>
  <desc id="d21d">A Gradebook box holds a pointer labelled scheme_ of type
  GradingScheme pointer. An arrow from it points to one of two objects shown below: a
  PointsBased object and a Weighted object. A call written as scheme underscore arrow
  computePercentage leaves the Gradebook and follows the pointer. Two labelled paths
  show that when the pointer refers to the PointsBased object the points-based rule
  runs, and when it refers to the Weighted object the weighted rule runs. A note
  records that Gradebook contains no branch and never asks which kind it holds.</desc>
  <defs>
    <marker id="dm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia,'Times New Roman',serif" fill="#1a1a1a" font-size="12">
    <rect x="20" y="60" width="200" height="80" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="120" y="82" text-anchor="middle" font-size="13" font-weight="bold">Gradebook</text>
    <text x="35" y="104" font-family="'Courier New',monospace" font-size="11">GradingScheme* scheme_;</text>
    <text x="35" y="126" font-family="'Courier New',monospace" font-size="11" fill="#2c6e2c">scheme_-&gt;computePercentage()</text>

    <path d="M222,118 L300,90"  stroke="#444" stroke-width="1.6" marker-end="url(#dm)"/>
    <path d="M222,122 L300,210" stroke="#444" stroke-width="1.6" marker-end="url(#dm)"/>
    <text x="250" y="92"  font-size="11" fill="#555">or</text>
    <text x="250" y="200" font-size="11" fill="#555">or</text>

    <rect x="305" y="52" width="200" height="72" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="405" y="74" text-anchor="middle" font-size="13" font-weight="bold">PointsBased object</text>
    <text x="320" y="96" font-size="11">computePercentage() runs</text>
    <text x="320" y="113" font-size="11" fill="#555">earned ÷ possible × 100</text>
    <text x="520" y="92" font-size="12" fill="#2c6e2c">→ 87.5%</text>

    <rect x="305" y="176" width="200" height="72" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="405" y="198" text-anchor="middle" font-size="13" font-weight="bold">Weighted object</text>
    <text x="320" y="220" font-size="11">computePercentage() runs</text>
    <text x="320" y="237" font-size="11" fill="#555">combine categories by weight</text>
    <text x="520" y="216" font-size="12" fill="#2c6e2c">→ 84.4%</text>

    <text x="330" y="278" text-anchor="middle" font-size="13">
      Gradebook contains no branch and never asks which kind it holds.
    </text>
    <text x="330" y="296" text-anchor="middle" font-size="12" fill="#555">
      The object decides. That is dynamic dispatch.
    </text>
  </g>
</svg>
