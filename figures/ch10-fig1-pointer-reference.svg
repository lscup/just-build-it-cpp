<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330"
     role="img" aria-labelledby="p10t p10d">
  <title id="p10t">A variable, a pointer to it, and a reference to it</title>
  <desc id="p10d">Three panels. The first shows a variable named score at address 4000
  holding 84.0. The second shows a pointer named ptr at address 5000 holding the value
  4000, with an arrow from ptr to score, and notes that ptr is a separate variable that
  stores an address. The third shows a reference named alias with no box of its own,
  drawn as a second label attached to the same box at address 4000, and notes that a
  reference is another name for an existing variable and occupies no storage of its
  own.</desc>
  <defs>
    <marker id="pm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia,'Times New Roman',serif" fill="#1a1a1a" font-size="13">

    <text x="20" y="26" font-weight="bold" font-size="14">1. A variable</text>
    <text x="20" y="46" font-family="'Courier New',monospace" font-size="12">double score = 84.0;</text>
    <rect x="20" y="58" width="120" height="48" fill="#d6e4f5" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="88" text-anchor="middle" font-size="16">84.0</text>
    <text x="80" y="122" text-anchor="middle" font-size="11" fill="#555" font-family="'Courier New',monospace">4000</text>
    <text x="80" y="140" text-anchor="middle" font-size="12">score</text>

    <text x="230" y="26" font-weight="bold" font-size="14">2. A pointer to it</text>
    <text x="230" y="46" font-family="'Courier New',monospace" font-size="12">double* ptr = &amp;score;</text>
    <rect x="230" y="58" width="120" height="48" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="290" y="88" text-anchor="middle" font-size="16">4000</text>
    <text x="290" y="122" text-anchor="middle" font-size="11" fill="#555" font-family="'Courier New',monospace">5000</text>
    <text x="290" y="140" text-anchor="middle" font-size="12">ptr</text>
    <path d="M230,82 L150,82" stroke="#444" stroke-width="1.6" marker-end="url(#pm)"/>
    <text x="230" y="172" text-anchor="middle" font-size="12" fill="#555">a separate variable,</text>
    <text x="230" y="188" text-anchor="middle" font-size="12" fill="#555">holding an address</text>

    <text x="440" y="26" font-weight="bold" font-size="14">3. A reference to it</text>
    <text x="440" y="46" font-family="'Courier New',monospace" font-size="12">double&amp; alias = score;</text>
    <rect x="440" y="58" width="120" height="48" fill="#d6e4f5" stroke="#2c3e50" stroke-width="2"/>
    <text x="500" y="88" text-anchor="middle" font-size="16">84.0</text>
    <text x="500" y="122" text-anchor="middle" font-size="11" fill="#555" font-family="'Courier New',monospace">4000</text>
    <text x="500" y="140" text-anchor="middle" font-size="12">score</text>
    <text x="500" y="158" text-anchor="middle" font-size="12" font-style="italic">alias</text>
    <path d="M470,146 L490,146" stroke="#8a6d3b" stroke-width="1.2"/>
    <text x="500" y="190" text-anchor="middle" font-size="12" fill="#555">no box of its own —</text>
    <text x="500" y="206" text-anchor="middle" font-size="12" fill="#555">a second name for score</text>

    <line x1="200" y1="14" x2="200" y2="230" stroke="#ccc" stroke-width="1"/>
    <line x1="410" y1="14" x2="410" y2="230" stroke="#ccc" stroke-width="1"/>

    <text x="330" y="262" text-anchor="middle" font-size="13">
      A pointer stores an address and can be redirected or left empty.
    </text>
    <text x="330" y="284" text-anchor="middle" font-size="13">
      A reference is bound to one variable when created and can never be moved.
    </text>
    <text x="330" y="312" text-anchor="middle" font-size="13" fill="#555">
      Both let a function reach the caller's variable. References are simpler, so prefer them.
    </text>
  </g>
</svg>
