<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340"
     role="img" aria-labelledby="l13t l13d">
  <title id="l13t">The five phases of the software development lifecycle</title>
  <desc id="l13d">Five boxes arranged in a ring, connected by arrows in order:
  Planning, Analysis, Design, Development, and Maintenance. A long arrow returns from
  Maintenance to Planning, showing that maintenance generates new requirements and the
  cycle repeats. Each box lists its main output: planning produces a feasibility
  assessment and requirements, analysis produces a model of the problem, design
  produces an architecture and interfaces, development produces working tested code,
  and maintenance produces fixes and enhancements.</desc>
  <defs>
    <marker id="lm" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <g font-family="Georgia,'Times New Roman',serif" fill="#1a1a1a" font-size="12">
    <rect x="20"  y="60" width="112" height="60" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="76" y="82" text-anchor="middle" font-size="13" font-weight="bold">1. Planning</text>
    <text x="76" y="99" text-anchor="middle" font-size="11">feasibility,</text>
    <text x="76" y="113" text-anchor="middle" font-size="11">requirements</text>

    <rect x="152" y="60" width="112" height="60" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="208" y="82" text-anchor="middle" font-size="13" font-weight="bold">2. Analysis</text>
    <text x="208" y="99" text-anchor="middle" font-size="11">model of the</text>
    <text x="208" y="113" text-anchor="middle" font-size="11">problem</text>

    <rect x="284" y="60" width="112" height="60" rx="5" fill="#e8eef7" stroke="#2c3e50" stroke-width="2"/>
    <text x="340" y="82" text-anchor="middle" font-size="13" font-weight="bold">3. Design</text>
    <text x="340" y="99" text-anchor="middle" font-size="11">architecture,</text>
    <text x="340" y="113" text-anchor="middle" font-size="11">interfaces</text>

    <rect x="416" y="60" width="112" height="60" rx="5" fill="#eef7ee" stroke="#2c3e50" stroke-width="2"/>
    <text x="472" y="82" text-anchor="middle" font-size="13" font-weight="bold">4. Development</text>
    <text x="472" y="99" text-anchor="middle" font-size="11">working,</text>
    <text x="472" y="113" text-anchor="middle" font-size="11">tested code</text>

    <rect x="548" y="60" width="100" height="60" rx="5" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="598" y="82" text-anchor="middle" font-size="13" font-weight="bold">5. Mainten-</text>
    <text x="598" y="97" text-anchor="middle" font-size="13" font-weight="bold">ance</text>
    <text x="598" y="113" text-anchor="middle" font-size="11">fixes, changes</text>

    <path d="M134,90 L150,90" stroke="#444" stroke-width="1.6" marker-end="url(#lm)"/>
    <path d="M266,90 L282,90" stroke="#444" stroke-width="1.6" marker-end="url(#lm)"/>
    <path d="M398,90 L414,90" stroke="#444" stroke-width="1.6" marker-end="url(#lm)"/>
    <path d="M530,90 L546,90" stroke="#444" stroke-width="1.6" marker-end="url(#lm)"/>

    <path d="M598,122 L598,175 L76,175 L76,124" stroke="#444" stroke-width="1.6" fill="none"/>
    <path d="M76,140 L76,124" stroke="#444" stroke-width="1.6" marker-end="url(#lm)"/>
    <text x="337" y="195" text-anchor="middle" font-size="12" fill="#555">
      maintenance raises new requirements, and the cycle repeats
    </text>

    <text x="330" y="240" text-anchor="middle" font-size="13">
      Most of a program's life is spent in phase 5.
    </text>
    <text x="330" y="262" text-anchor="middle" font-size="13">
      The Grade Calculator you inherit in this chapter is already there.
    </text>
    <text x="330" y="296" text-anchor="middle" font-size="12" fill="#555">
      A defect found in planning costs minutes. The same defect found in
    </text>
    <text x="330" y="314" text-anchor="middle" font-size="12" fill="#555">
      maintenance costs orders of magnitude more.
    </text>
  </g>
</svg>
