<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330"
     role="img" aria-labelledby="c18t c18d">
  <title id="c18t">A struct compared with a class holding the same data</title>
  <desc id="c18d">Two panels side by side. The left shows a struct named Student with
  three public members, name, id, and scores, and separate free functions total and
  percentage drawn outside it, with arrows showing any code can reach the members. The
  right shows a class named Student with the same three members marked private and
  enclosed, and member functions addAssignment, totalEarned and percentage inside the
  boundary, with a note that outside code can only call the functions.</desc>
  <g font-family="Georgia,'Times New Roman',serif" fill="#1a1a1a" font-size="12">
    <text x="160" y="24" text-anchor="middle" font-size="14" font-weight="bold">struct — data only</text>
    <rect x="30" y="38" width="260" height="106" fill="#fdf6e3" stroke="#2c3e50" stroke-width="2"/>
    <text x="45" y="58" font-family="'Courier New',monospace" font-size="12">struct Student {</text>
    <text x="60" y="76" font-family="'Courier New',monospace" font-size="12">string name;</text>
    <text x="60" y="94" font-family="'Courier New',monospace" font-size="12">int id;</text>
    <text x="60" y="112" font-family="'Courier New',monospace" font-size="12">vector&lt;Score&gt; scores;</text>
    <text x="45" y="132" font-family="'Courier New',monospace" font-size="12">};</text>
    <text x="160" y="164" text-anchor="middle" font-size="11" fill="#8a6d3b">all members public</text>

    <rect x="30" y="176" width="260" height="60" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="45" y="196" font-family="'Courier New',monospace" font-size="12">double total(const Student&amp;);</text>
    <text x="45" y="214" font-family="'Courier New',monospace" font-size="12">double percentage(const Student&amp;);</text>
    <text x="160" y="230" text-anchor="middle" font-size="11" fill="#555">free functions, outside</text>
    <text x="160" y="262" text-anchor="middle" font-size="12" fill="#b03030">any code can write s.id = -5;</text>

    <line x1="330" y1="14" x2="330" y2="290" stroke="#ccc" stroke-width="1"/>

    <text x="495" y="24" text-anchor="middle" font-size="14" font-weight="bold">class — data with behavior</text>
    <rect x="365" y="38" width="270" height="198" fill="#e8eef7" stroke="#2c3e50" stroke-width="2.5"/>
    <text x="380" y="58" font-family="'Courier New',monospace" font-size="12">class Student {</text>
    <text x="380" y="78" font-family="'Courier New',monospace" font-size="12" fill="#2c6e2c">public:</text>
    <text x="395" y="96" font-family="'Courier New',monospace" font-size="12">addAssignment(...)</text>
    <text x="395" y="114" font-family="'Courier New',monospace" font-size="12">totalEarned() const</text>
    <text x="395" y="132" font-family="'Courier New',monospace" font-size="12">percentage() const</text>
    <text x="380" y="154" font-family="'Courier New',monospace" font-size="12" fill="#b03030">private:</text>
    <text x="395" y="172" font-family="'Courier New',monospace" font-size="12">string name_;</text>
    <text x="395" y="190" font-family="'Courier New',monospace" font-size="12">int id_;</text>
    <text x="395" y="208" font-family="'Courier New',monospace" font-size="12">vector&lt;Assignment&gt; work_;</text>
    <text x="380" y="228" font-family="'Courier New',monospace" font-size="12">};</text>
    <text x="495" y="262" text-anchor="middle" font-size="12" fill="#2c6e2c">outside code can only call the functions</text>

    <text x="330" y="300" text-anchor="middle" font-size="13">
      The data did not change. What can reach it did.
    </text>
    <text x="330" y="320" text-anchor="middle" font-size="12" fill="#555">
      A class can guarantee things about itself that a struct cannot.
    </text>
  </g>
</svg>
